# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.265
neoform_version=1.21.1-20240808.144430
mixin_version=0.16.4+mixin.0.8.7
mixinextras_version=0.5.5
jspecify_version=1.0.0
mixinsquared_version=0.3.7-beta.3
fabric_loom_version=1.19-SNAPSHOT
fabric_loader_version=0.20.1
fabric_api_version=0.116.18+1.21.1
# Aligned with the junit-bom that FML's junit launcher (junit-fml) imports.
junit_version=5.13.4
errorprone_version=2.50.0
nullaway_version=0.14.2

## Mod Properties

# The license of the mod.
mod_license=PolyForm-Shield-1.0.0
# The group ID for the mod. Should match the base package used for the mod sources.
mod_group_id=com.ascendia
# The mod version. See https://semver.org/
ascendia_core_version=0.1.35
ascendia_core_build=v.1
