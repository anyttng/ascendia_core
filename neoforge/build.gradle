plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
}

evaluationDependsOn(':common')

ext {
    mod_id = 'ascendia_core'
    mod_name = 'Ascendia: Core'
    mod_version = ascendia_core_version
}

version = mod_version
group = mod_group_id

def withBuildSuffix = { baseVersion ->
    def buildSuffix = findProperty("${mod_id}_build")
    buildSuffix ? "${baseVersion}-${buildSuffix}" : baseVersion
}
def modIngameVersion = withBuildSuffix(mod_version)
def jarVersion = withBuildSuffix("${mod_version}+mc${minecraft_version}")

base {
    archivesName = mod_id
}

tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-neoforge-${jarVersion}.jar"
    from(project(':common').sourceSets.main.output)
}

tasks.named('assemble') {
    dependsOn ':common:jar'
    dependsOn ':modJar'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.ascendia_core
    }
}

dependencies {
    implementation project(':common')

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.test.java.srcDir '../common/src/loaderTest/java'

test {
    useJUnitPlatform()
    filter {
        failOnNoMatchingTests = false
    }
    systemProperty 'ascendia_core.reports', layout.buildDirectory.dir('reports').get().asFile.absolutePath
    dependsOn(':common:test')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modIngameVersion,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
